# Push a tag like v0.2.0 to build the Windows installer and the update manifest into a
# draft release. Publishing the draft is what makes installed copies update.
name: Release

# wooshaq fork: releases are built and uploaded by hand, so a tag push doesn't start this.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mantel ${{ github.ref_name }}
          releaseBody: |
            Download the Mantel setup .exe below. Installed copies update themselves from Settings.

            [Code signing policy](https://playmantel.com/code-signing) · [Privacy statement](https://playmantel.com/privacy)
          releaseDraft: true
          includeUpdaterJson: false
