name: Independent wsq.1 rebuild audit
on:
  push:
    branches:
      - audit/rebuild-wsq1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout exact wsq.1 source commit
        uses: actions/checkout@v4
        with:
          ref: 0286484c3c1cbbd7dc96ad910915480ec788f872
          persist-credentials: false
      - name: Verify source commit
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($sha -ne '0286484c3c1cbbd7dc96ad910915480ec788f872') { throw "Wrong source commit: $sha" }
          Write-Host "Verified source commit: $sha"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install pinned frontend dependencies
        run: npm ci
      - name: Build portable executable from source
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle
      - name: Hash and collect executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw "Expected one EXE, got $($files.Count)" }
          New-Item -ItemType Directory -Force -Path audit-output | Out-Null
          Copy-Item $files[0].FullName audit-output/rebuilt-wsq1.exe
          Get-FileHash audit-output/rebuilt-wsq1.exe -Algorithm SHA256 | Format-List | Out-String | Set-Content audit-output/SHA256.txt
          Get-Item audit-output/rebuilt-wsq1.exe | Select-Object Name,Length | Format-List | Out-String | Add-Content audit-output/SHA256.txt
      - name: Upload rebuild for independent binary comparison
        uses: actions/upload-artifact@v4
        with:
          name: wsq1-independent-rebuild
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
